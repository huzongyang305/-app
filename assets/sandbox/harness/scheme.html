<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<pre id="sandbox-output" hidden></pre>
<script>/*__COMMON__*/</script>
<script>/*__RUNTIME_1__*/</script>
<script>
(function () {
  __sandboxBegin();
  try {
    var Biwa = window.BiwaScheme;
    if (!Biwa) {
      __sandboxPush('Error: Scheme 运行时加载失败');
      __sandboxFinish();
      return;
    }
    // 把标准输入预置成 Scheme 列表，并定义 read-line / read-line-string
    var lines = window.__sandboxStdinLines().map(function (line) {
      return JSON.stringify(String(line));
    }).join(' ');
    var prelude =
      '(define __sandbox_stdin (list ' + lines + '))\n' +
      '(define (read-line) ' +
      '(if (null? __sandbox_stdin) #f ' +
      '(let ((line (car __sandbox_stdin))) ' +
      '(set! __sandbox_stdin (cdr __sandbox_stdin)) line)))\n' +
      '(define (read-line-string) ' +
      '(let ((line (read-line))) (if line line "")))\n';

    var printed = [];
    Biwa.Port.current_output = new Biwa.Port.CustomOutput(function (text) {
      printed.push(text);
    });
    var interpreter = new Biwa.Interpreter(function (error) {
      __sandboxPush(
        'Error: ' + (error && error.message ? error.message : String(error))
      );
    });
    interpreter.evaluate(prelude);
    var value = interpreter.evaluate(__USER_CODE__);
    if (printed.length) __sandboxPush(printed.join(''));
    if (
      typeof value !== 'undefined' &&
      typeof Biwa.isUndef === 'function' &&
      !Biwa.isUndef(value)
    ) {
      __sandboxPush('=> ' + Biwa.to_write(value));
    }
  } catch (error) {
    __sandboxPush('Error: ' + (error && error.stack ? error.stack : String(error)));
  }
  __sandboxFinish();
})();
</script>
</body>
</html>
