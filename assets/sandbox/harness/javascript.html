<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<pre id="sandbox-output" hidden></pre>
<script>/*__COMMON__*/</script>
<script>
(function () {
  __sandboxBegin();
  try {
    // 标准输入：readLine() / readline() 逐行读取，prompt() 也会消费一行。
    var readLine = window.__sandboxReadLine;
    window.readLine = readLine;
    window.readline = readLine;
    window.prompt = function (message) {
      return readLine(message);
    };
    if (window.__sandboxStdinRemaining() > 0) {
      __sandboxPush('（已预置 ' + window.__sandboxStdinRemaining() + ' 行标准输入）');
    }
    // 用 Function 包一层，用户代码可以写 return 之外的任意语句。
    var runner = new Function(__USER_CODE__);
    var value = runner();
    if (typeof value !== 'undefined') {
      __sandboxPush('=> ' + __sandboxStringify(value));
    }
  } catch (error) {
    __sandboxPush('Error: ' + (error && error.stack ? error.stack : String(error)));
  }
  __sandboxFinish();
})();
</script>
</body>
</html>
