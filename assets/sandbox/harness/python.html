<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<pre id="sandbox-output" hidden></pre>
<script>/*__COMMON__*/</script>
<script>
(function () {
  // Brython 默认用 document.currentScript.src 推断自身路径，内联脚本拿不到 src，
  // 因此按当前页面地址预先给出绝对路径，避免它去解析非法 URL。
  var base = location.href.split('#')[0].replace(/[^/]*$/, '');
  window.__BRYTHON__ = { brython_path: base };
})();
</script>
<script>/*__RUNTIME_1__*/</script>
<script>/*__RUNTIME_2__*/</script>
<script>
(function () {
  __sandboxBegin();
  try {
    brython();
  } catch (error) {
    __sandboxPush('Error: 初始化 Python 运行时失败：' + (error && error.message ? error.message : String(error)));
    __sandboxFinish();
    return;
  }
  // 沙箱页面可能通过 file:// 打开，Brython 在 file:// 下会关闭标准库导入；
  // 这里把协议声明成 https，让内置的标准库正常导入（不会真的发起网络请求）。
  if (__BRYTHON__.protocol === 'file') {
    __BRYTHON__.protocol = 'https';
  }
  // 标准输入：把用户填写的文本按行注入 Python 的 input()。
  var stdinJson = JSON.stringify(window.__sandboxStdinLines());
  var prelude =
    '__sandbox_stdin__ = ' + stdinJson + '\n' +
    'def input(prompt=""):\n' +
    '    if prompt:\n' +
    '        print(prompt, end="")\n' +
    '    if not __sandbox_stdin__:\n' +
    '        raise EOFError("标准输入已用尽，请在沙箱的 stdin 输入框补充内容")\n' +
    '    return __sandbox_stdin__.pop(0)\n' +
    'try:\n' +
    '    import builtins as __sandbox_builtins__\n' +
    '    __sandbox_builtins__.input = input\n' +
    'except Exception:\n' +
    '    pass\n';
  var source = prelude + __USER_CODE__;
  var before = window.__sandboxLogs.length;
  try {
    __BRYTHON__.runPythonSource(source, 'sandbox_user_code');
  } catch (error) {
    // Brython 抛异常前已经把 traceback 打到 console.error，这里只做兜底。
    if (window.__sandboxLogs.length === before) {
      __sandboxPush('Error: ' + __sandboxStringify(error));
    }
  }
  __sandboxFinish();
})();
</script>
</body>
</html>
