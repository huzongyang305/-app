name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布 tag（例如 v1.4.1）'
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-pub
      - name: Tests
        run: flutter test --no-pub
      - name: Build universal and per-ABI release APKs
        run: |
          flutter build apk --release --target-platform android-arm,android-arm64
          flutter build apk --release --split-per-abi
      - name: Enforce size budget and write report
        run: |
          dart run tool/apk_size_report.dart --budget-mb=90 \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
      - name: Generate SHA-256 release manifest
        run: |
          dart run tool/release_manifest.dart \
            --version="${{ github.ref_name }}" \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/reports/SHA256SUMS.txt
            build/reports/release_manifest.json
            build/reports/apk_size_report.md
          fail_on_unmatched_files: true
