name: Android device smoke

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # 覆盖 Android 11 / 13 / 15：验证文件选择器、通知与 WebView 沙箱
        # 在旧系统和新系统上的行为，避免只在最新 API 上验证。
        api-level: [30, 33, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android integration smoke test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect
          disable-animations: true
          # 关闭 DDS 会让 integration_test 的金标流监听失败，因此保留 DDS，
          # 只对偶发的 DDS 启动失败做一次重试。
          script: flutter test integration_test/app_smoke_test.dart -d emulator-5554 --no-pub || flutter test integration_test/app_smoke_test.dart -d emulator-5554 --no-pub
      - name: Run Android performance baseline
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect
          disable-animations: true
          script: |
            flutter test integration_test/app_performance_test.dart -d emulator-5554 --no-pub > performance-${{ matrix.api-level }}.log 2>&1
            status=$?
            cat performance-${{ matrix.api-level }}.log
            exit $status
      - name: Archive performance baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-baseline-api${{ matrix.api-level }}
          path: performance-${{ matrix.api-level }}.log
          if-no-files-found: warn
